# Gabarit - rendu par omega_jail.tailscale_bridge.render_action_conf()
# au moment de l'installation, jamais utilise tel quel. Pont
# Tailscale -> blocklist native omega-serv (451) : derriere Tailscale,
# la regle nftables qui accepte le trafic du tunnel passe toujours
# avant celle que fail2ban insere pour bannir - le ban reseau est un
# no-op pour ces clients. Ce pont bascule alors l'enforcement vers la
# blocklist applicative d'omega-serv, qui renvoie un 451 explicite.
#
# TOUJOURS fail-open (voir omega_jail/tailscale_bridge.py::main) : une
# erreur ici (binaire omega-serv absent, config introuvable) ne doit
# jamais faire echouer le ban nftables par defaut (%(action_)s),
# execute en parallele par la meme ligne `action =` du jail.
[Definition]
actionstart =
actionstop =
actioncheck =
actionban = $bridge_cli --ip=<ip> --mode=ban --servcli="$servcli" --servconfig="$servconfig" --cidr="$tailscale_cidr" --exempt="$exempt" --jail=<name> --bantime=<bantime>
actionunban = $bridge_cli --ip=<ip> --mode=unban --servcli="$servcli" --servconfig="$servconfig" --cidr="$tailscale_cidr" --exempt="$exempt" --jail=<name>
