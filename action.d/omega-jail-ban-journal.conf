# Gabarit - rendu par omega_jail.install.render_journal_action_conf() au moment de l'installation, jamais
# utilise tel quel. Journal des bans (plan omega-connect, phase 3, 2026-11-21) : chaque ban et levee du jail
# qui porte cette action est publie dans la zone omega-synchro (/var/lib/omega-synchro/bans/), lu par
# Active Defense d'omega-serv. TOUJOURS fail-open (omega_jail/ban_journal.py::main) : sans zone ou en cas
# d'erreur, rien n'est ecrit et le ban reseau (%(action_)s, meme ligne `action =`) n'est jamais affecte.
[Definition]
actionstart =
actionstop =
actioncheck =
actionban = $journal_cli --mode=ban --ip=<ip> --jail=<name> --bantime=<bantime>
actionunban = $journal_cli --mode=unban --ip=<ip> --jail=<name>
