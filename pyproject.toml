[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-jail"
version = "0.1.0"
description = "Catalogue preconfigure de jails fail2ban pour omega-serv et omega-waf"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kraynux", email = "kraynux@proton.me" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[project.scripts]
omega-jail = "omega_jail.cli:main"
omega-jail-tailscale-bridge = "omega_jail.tailscale_bridge:main"

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.10"
strict = true
